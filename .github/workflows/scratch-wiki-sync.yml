name: Scratch Wiki Knowledge Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/sync-scratchwiki.mjs
      - run: node scripts/build-knowledge-index.mjs

      - name: Commit knowledge updates
        run: |
          git config user.name "sb3-AIAgent bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/pages.json knowledge/index.json
          git diff --cached --quiet || git commit -m "Sync Scratch Wiki knowledge"
          git push
